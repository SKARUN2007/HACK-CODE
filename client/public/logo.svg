<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Left Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#007791" />
    </linearGradient>
    
    <!-- Middle Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>
    
    <!-- Right Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#009944" />
    </linearGradient>
  </defs>

  <!-- LOGO ICON (Centered at top) -->
  <g transform="translate(100, 20)">
    <!-- Heads -->
    <circle cx="95" cy="55" r="28" fill="url(#cyanGrad)" />
    <circle cx="150" cy="35" r="32" fill="url(#blueGrad)" />
    <circle cx="205" cy="55" r="28" fill="url(#greenGrad)" />

    <!-- Center Blue Body -->
    <path d="M 110,85 
             C 125,75 175,75 190,85 
             C 215,115 220,150 150,210 
             C 80,150 85,115 110,85 Z" 
          fill="url(#blueGrad)" opacity="0.95" />

    <!-- Left Cyan Body & Arm Arc -->
    <path d="M 95,85 
             C 65,100 50,140 70,185 
             C 90,225 150,250 150,250 
             C 150,250 95,215 75,175 
             C 55,135 75,100 95,85 Z" 
          fill="url(#cyanGrad)" />

    <!-- Left Cyan Inner Wing/Arm -->
    <path d="M 95,85 
             C 115,120 135,160 150,250 
             C 125,215 90,170 70,130 
             C 75,105 85,90 95,85 Z" 
          fill="url(#cyanGrad)" />

    <!-- Right Green Body & Arm Arc -->
    <path d="M 205,85 
             C 235,100 250,140 230,185 
             C 210,225 150,250 150,250 
             C 150,250 205,215 225,175 
             C 245,135 225,100 205,85 Z" 
          fill="url(#greenGrad)" />

    <!-- Right Green Inner Wing/Arm -->
    <path d="M 205,85 
             C 185,120 165,160 150,250 
             C 175,215 210,170 230,130 
             C 225,105 215,90 205,85 Z" 
          fill="url(#greenGrad)" />

    <!-- Heart Emblem Inner Cutout Curve -->
    <path d="M 125,140 
             C 140,165 150,175 150,175 
             C 150,175 160,165 175,140 
             C 185,170 165,210 150,230 
             C 135,210 115,170 125,140 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- MAKKALSAANTRU TEXT BELOW LOGO -->
  <text x="250" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
    <tspan fill="#003882">MAKKAL</tspan><tspan fill="#00A86B">SAANTRU</tspan>
  </text>
</svg>
